# Render Blueprint: the panel/API web service (free plan).
# The database is external (Neon free tier) because Render's free Postgres is deleted after 30 days.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo, then paste the Neon values when prompted.
services:
  - type: web
    name: y-bot-admin-panel
    runtime: node
    plan: free # sleeps after ~15 min without inbound traffic; .github/workflows/keep-alive.yml pings it
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: ACCESS_SECRET
        generateValue: true
      - key: REFRESH_SECRET
        generateValue: true
      # sync: false -> Render asks for it on first deploy (Neon's connection string, same as in .env)
      - key: DATABASE_URL
        sync: false
