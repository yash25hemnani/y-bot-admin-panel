  <circle cx="24" cy="6" r="3.5" fill="#2DD4B4"/>
  <circle cx="24" cy="6" r="1.4" fill="#0A111C"/>
  <circle cx="16" cy="15" r="2.6" fill="#2DD4B4"/>
  <circle cx="16" cy="15" r="1" fill="#0A111C"/>
  <rect x="11.5" y="23" width="9" height="6" rx="1" fill="#2DD4B4"/>
</svg>
